---
version: 5
defaults:
  datadir: hieradata
  data_hash: yaml_data

hierarchy:
  - name: "Node-specific overrides"
    path: "nodes/%{trusted.certname}.yaml"

  - name: "call security_hardening variables"
    path: "../modules/security_hardening/data/common.yaml"
  - name: "call monitoring variables"
    path: "../modules/monitoring/data/common.yaml"
  - name: "call networking variables"
    path: "../modules/networking/data/common.yaml"
  - name: "call time variables"
    path: "../modules/time/data/common.yaml"
